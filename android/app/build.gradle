apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootProject.projectDir.parentFile
project.ext.vectoricons = [ iconFontsDir: "${projectRoot}/node_modules/react-native-vector-icons/Fonts" ]
apply from: file("${projectRoot}/node_modules/react-native-vector-icons/fonts.gradle")

react {
    autolinkLibrariesWithApp()
    def nodePath = rootProject.findProperty("NODE_BINARY") ?: "node"
    nodeExecutableAndArgs = [nodePath]
}

def enableProguardInReleaseBuilds = false
def jscFlavor = "org.webkit:android-jsc:+"

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.birthdayapp"
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.birthdayapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    packaging {
        jniLibs {
            pickFirsts += [
                "lib/arm64-v8a/libc++_shared.so",
                "lib/armeabi-v7a/libc++_shared.so",
                "lib/x86/libc++_shared.so",
                "lib/x86_64/libc++_shared.so",
                "**/libhermes.so",
                "**/libhermes_executor.so"
            ]
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.multidex:multidex:2.0.1")
    def useHermes = (rootProject.findProperty("hermesEnabled") ?: "true").toBoolean()
    if (useHermes) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
