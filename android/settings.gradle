pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
}
plugins { id("com.facebook.react.settings") }
// Root includeBuild so buildscript classpath resolves react-native-gradle-plugin
includeBuild("../node_modules/@react-native/gradle-plugin") {
  dependencySubstitution {
    substitute module("com.facebook.react:react-native-gradle-plugin") using project(":react-native-gradle-plugin")
  }
}

extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }

rootProject.name = 'BirthdayApp'
include ':app'
